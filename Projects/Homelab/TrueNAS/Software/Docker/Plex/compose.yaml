services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - VERSION=docker
      - PLEX_CLAIM= #optional
    volumes:
      - /mnt/Main/Apps/dockge/plex:/config
      - /mnt/Main/storage/videos/media/movies:/movies
    restart: unless-stopped
